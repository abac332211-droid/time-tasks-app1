name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/v2.9.0-stability, codex/v2.9.1-stability, codex/v2.9.1-stopwatch-integrity-fix]
  pull_request:
    branches: [codex/v2.9.1-stability]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify checked-out source SHA
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verified source SHA: $ACTUAL_SHA"
          echo "Expected source SHA: $EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run regression tests
        run: npm test

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p web
          cp index.html manifest.json sw.js web/
          cp *.png web/ 2>/dev/null || true
          ls -la web/

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Force-create Capacitor config
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.abac332211.timetasks",
            "appName": "TimeTasks",
            "webDir": "web"
          }
          EOF
          cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Configure native stopwatch clock and foreground service
        run: python3 scripts/configure-android-stopwatch.py

      - name: Align Android version with app sources
        run: python3 scripts/configure-android-version.py

      - name: Isolate Debug APK from production installation
        run: python3 scripts/configure-android-debug.py

      - name: Fix Android project
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">إدارة الوقت</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">إدارة الوقت</string>|' android/app/src/main/res/values/strings.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            folder="android/app/src/main/res/mipmap-$d"
            if [ -d "$folder" ]; then
              cp icon-192.png "$folder/ic_launcher.png" 2>/dev/null || true
              cp icon-192.png "$folder/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$folder/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          echo "Icons updated"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify merged Android notification permissions
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.abac332211.timetasks.debug'"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          grep -q "android.permission.POST_NOTIFICATIONS" <<< "$PERMISSIONS"
          grep -q "android.permission.RECEIVE_BOOT_COMPLETED" <<< "$PERMISSIONS"
          grep -q "android.permission.WAKE_LOCK" <<< "$PERMISSIONS"
          grep -q "android.permission.FOREGROUND_SERVICE" <<< "$PERMISSIONS"
          grep -q "android.permission.FOREGROUND_SERVICE_SPECIAL_USE" <<< "$PERMISSIONS"
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android/app/src/main/AndroidManifest.xml

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
