name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p web
          cp index.html manifest.json sw.js web/
          cp *.png web/ 2>/dev/null || true
          ls -la web/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Force-create Capacitor config
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.abac332211.timetasks",
            "appName": "TimeTasks",
            "webDir": "web"
          }
          EOF
          cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Android project
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">إدارة الوقت</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">إدارة الوقت</string>|' android/app/src/main/res/values/strings.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            folder="android/app/src/main/res/mipmap-$d"
            if [ -d "$folder" ]; then
              cp icon-192.png "$folder/ic_launcher.png" 2>/dev/null || true
              cp icon-192.png "$folder/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$folder/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          echo "Icons updated"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-tasks-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
