name: Dependency audit report

on:
  push:
    branches:
      - codex/v2.9.1-stability
  pull_request:
    branches:
      - main
      - codex/v2.9.1-stability

permissions:
  contents: read

concurrency:
  group: dependency-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked-out source SHA
        env:
          EXPECTED_SHA: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verified source SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install exact lockfile dependency tree
        run: npm ci --no-audit --no-fund

      - name: Generate npm audit JSON
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          AUDIT_EXIT=$?
          set -e
          test -s npm-audit.json
          echo "audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
          echo "npm audit exit code: $AUDIT_EXIT"

      - name: Upload complete npm audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-audit-\${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: steps.audit.outputs.audit_exit != '0'
        run: |
          echo "::error::npm audit reported vulnerabilities or could not complete. Inspect the uploaded npm-audit.json artifact."
          exit 1
