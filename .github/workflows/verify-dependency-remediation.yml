name: Verify dependency audit remediation

on:
  push:
    branches:
      - codex/dependency-audit-remediation
  pull_request:
    branches:
      - codex/v2.9.1-stability

permissions:
  contents: read

jobs:
  verify-dependency-overrides:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify checked-out source SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verified source SHA: $ACTUAL_SHA"
          echo "Expected source SHA: $EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Regenerate package lock with scoped overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exactly from regenerated lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify pinned Capacitor CLI and resolved security toolchain
        run: |
          npx cap --version
          npm ls @capacitor/cli rimraf glob minimatch tar

      - name: Generate machine-readable audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          AUDIT_EXIT_CODE=$?
          set -e
          printf '%s\n' "$AUDIT_EXIT_CODE" > audit-exit-code.txt
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({vulnerabilities:r.metadata?.vulnerabilities, packages:Object.keys(r.vulnerabilities||{})},null,2));"
          echo "audit_exit_code=$AUDIT_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-remediation-evidence-${{ github.sha }}
          path: |
            package-lock.json
            npm-audit.json
            audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce clean dependency audit
        if: always()
        run: |
          test -s package-lock.json
          test -s audit-exit-code.txt
          test "$(cat audit-exit-code.txt)" = "0"

  persist-generated-lockfile:
    needs: verify-dependency-overrides
    if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/dependency-audit-remediation') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Download verified generated lockfile
        uses: actions/download-artifact@v8.0.2
        with:
          name: dependency-remediation-evidence-${{ github.sha }}
          path: generated-evidence

      - name: Commit lockfile generated in the isolated read-only job
        run: |
          test -s generated-evidence/package-lock.json
          cp generated-evidence/package-lock.json package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "Generated lockfile matches the branch; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock verified secure Capacitor toolchain"
          TARGET_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          test -n "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

