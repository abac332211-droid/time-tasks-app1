name: Verify PWA and regression cases

on:
  push:
    branches:
      - main
      - codex/final-audit-fixes
  pull_request:
    branches:
      - main

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: npm test
