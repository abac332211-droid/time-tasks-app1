name: Verify PWA and regression cases

on:
  push:
    branches:
      - main
      - codex/final-audit-fixes
      - codex/v2.9.0-stability
      - codex/v2.9.1-stability
      - codex/v2.9.1-stopwatch-integrity-fix
      - codex/pomodoro-integrity-writer-locking
      - codex/pomodoro-focus-timer-locking
      - codex/pomodoro-auxiliary-writer-locking
  pull_request:
    branches:
      - main
      - codex/v2.9.1-stability
      - codex/pomodoro-integrity-engine
      - codex/pomodoro-integrity-writer-locking
      - codex/pomodoro-focus-timer-locking

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verified source SHA: $ACTUAL_SHA"
          echo "Expected source SHA: $EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Playwright Chromium for real multi-window tests
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test

      - name: Prepare 2.9.1 candidate web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stability'
        id: candidate_web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p candidate-web
          cp index.html manifest.json sw.js docs/TESTING-2.9.1.md candidate-web/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png favicon-32.png favicon-16.png candidate-web/
          cd candidate-web
          zip -9 -r "../time-tasks-app-${VERSION}-candidate-web.zip" .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload 2.9.1 candidate web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stability'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-app-${{ steps.candidate_web.outputs.version }}-candidate-web
          path: time-tasks-app-${{ steps.candidate_web.outputs.version }}-candidate-web.zip
          if-no-files-found: error
          retention-days: 30


      - name: Prepare pinned full-source review bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stopwatch-integrity-fix'
        id: review_bundle
        env:
          BASE_REF: codex/v2.9.1-stability
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          HEAD_SHA="$(git rev-parse "${HEAD_SHA}")"
          BASE_SHA="$(git merge-base "${HEAD_SHA}" "refs/remotes/origin/${BASE_REF}")"
          test -n "${BASE_SHA}"
          mkdir -p review-bundle
          git archive --format=tar "${HEAD_SHA}" | gzip -9 > review-bundle/repository-source.tar.gz
          git diff --binary --full-index "${BASE_SHA}" "${HEAD_SHA}" > review-bundle/changes-from-base.patch
          git diff --stat "${BASE_SHA}" "${HEAD_SHA}" > review-bundle/diff-stat.txt
          git diff --name-status "${BASE_SHA}" "${HEAD_SHA}" > review-bundle/changed-files.txt
          git log --format='%H %s' "${BASE_SHA}..${HEAD_SHA}" > review-bundle/commit-history.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "head_ref=${GITHUB_REF_NAME}"
            echo "head_sha=${HEAD_SHA}"
            echo "base_ref=${BASE_REF}"
            echo "merge_base_sha=${BASE_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_archive=repository-source.tar.gz"
            echo "patch=changes-from-base.patch"
            echo "tests_and_workflows=contained_in_repository-source.tar.gz"
          } > review-bundle/manifest.txt
          sha256sum review-bundle/repository-source.tar.gz review-bundle/changes-from-base.patch > review-bundle/SHA256SUMS
          zip -9 -r "time-tasks-review-source-${HEAD_SHA}.zip" review-bundle
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload pinned full-source review bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stopwatch-integrity-fix'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-review-source-${{ steps.review_bundle.outputs.head_sha }}
          path: time-tasks-review-source-${{ steps.review_bundle.outputs.head_sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prepare downloadable web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-web
          cp index.html manifest.json sw.js BETA-TESTING.md release-web/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png favicon-32.png favicon-16.png release-web/
          cd release-web
          zip -9 -r ../time-tasks-app-2.9.0-web.zip .

      - name: Upload downloadable web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-app-2.9.0-web
          path: time-tasks-app-2.9.0-web.zip
          if-no-files-found: error
          retention-days: 90
