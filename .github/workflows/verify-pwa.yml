name: Verify PWA and regression cases

on:
  push:
    branches:
      - main
      - codex/final-audit-fixes
      - codex/v2.9.0-stability
      - codex/v2.9.1-stability
      - codex/v2.9.1-stopwatch-integrity-fix
  pull_request:
    branches:
      - main
      - codex/v2.9.1-stability

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Verified source SHA: $ACTUAL_SHA"
          echo "Expected source SHA: $EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Playwright Chromium for real multi-window tests
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test

      - name: Prepare 2.9.1 candidate web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stability'
        id: candidate_web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p candidate-web
          cp index.html manifest.json sw.js docs/TESTING-2.9.1.md candidate-web/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png favicon-32.png favicon-16.png candidate-web/
          cd candidate-web
          zip -9 -r "../time-tasks-app-${VERSION}-candidate-web.zip" .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload 2.9.1 candidate web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v2.9.1-stability'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-app-${{ steps.candidate_web.outputs.version }}-candidate-web
          path: time-tasks-app-${{ steps.candidate_web.outputs.version }}-candidate-web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prepare downloadable web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-web
          cp index.html manifest.json sw.js BETA-TESTING.md release-web/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png favicon-32.png favicon-16.png release-web/
          cd release-web
          zip -9 -r ../time-tasks-app-2.9.0-web.zip .

      - name: Upload downloadable web ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: time-tasks-app-2.9.0-web
          path: time-tasks-app-2.9.0-web.zip
          if-no-files-found: error
          retention-days: 90
