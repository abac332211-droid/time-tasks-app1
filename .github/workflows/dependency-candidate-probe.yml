name: Temporary Capacitor 6 dependency compatibility probe

on:
  push:
    branches:
      - codex/2.9.1-integrity-followup

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply isolated compatibility candidate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@capacitor/android'] = '6.2.4';
          pkg.dependencies['@capacitor/core'] = '6.2.4';
          pkg.devDependencies['@capacitor/cli'] = '6.2.4';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            '@capacitor/cli': {
              ...(pkg.overrides && pkg.overrides['@capacitor/cli'] || {}),
              rimraf: '6.1.4',
              tar: '7.5.24'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show resolved Capacitor and patched tools
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const names = ['@capacitor/android','@capacitor/core','@capacitor/cli','rimraf','glob','minimatch','tar'];
          for (const name of names) {
            const item = lock.packages['node_modules/' + name];
            if (!item) throw new Error('Missing lock entry: ' + name);
            console.log(name + '@' + item.version);
          }
          const expected = {
            '@capacitor/android': '6.2.4',
            '@capacitor/core': '6.2.4',
            '@capacitor/cli': '6.2.4',
            rimraf: '6.1.4',
            glob: '14.0.6',
            minimatch: '11.0.9',
            tar: '7.5.24'
          };
          for (const [name, version] of Object.entries(expected)) {
            const item = lock.packages['node_modules/' + name];
            if (!item || item.version !== version) {
              throw new Error(name + ' expected ' + version + ', got ' + (item && item.version));
            }
          }
          NODE
      - name: Install candidate lockfile
        run: npm ci --no-audit --no-fund
      - name: Install and verify pinned Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "const fs=require('node:fs');const {chromium}=require('playwright');const p=chromium.executablePath();if(!fs.existsSync(p))process.exit(1)"
      - name: Run full regression suite
        run: npm test
      - name: Verify Capacitor CLI commands
        run: |
          npx cap --version
          npx cap --help >/dev/null
      - name: Generate npm audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-candidate.json
          code=$?
          set -e
          test -s npm-audit-candidate.json
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          echo "npm audit exit code: $code"
      - name: Upload generated candidate manifests and audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: capacitor6-dependency-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            npm-audit-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce clean audit candidate
        if: steps.audit.outputs.audit_exit != '0'
        run: |
          echo "::error::The compatibility candidate still has audit findings."
          exit 1
